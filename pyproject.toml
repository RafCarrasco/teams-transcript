[project]
name = "teams-transcript"
version = "0.1.0"
description = "Transcrição silenciosa de calls do Microsoft Teams — local-first, sem entrar na call."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rafael Carrasco" }]
requires-python = ">=3.11,<3.13"

# Dependências base — leves, instalam em qualquer plataforma.
# As pesadas (áudio, ML, UI) ficam em optional-dependencies pra não travar
# ambientes de dev/CI que só querem rodar os testes de lógica pura.
dependencies = [
    "typer>=0.12",
    "loguru>=0.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "google-genai>=0.3",
    "psutil>=5.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4",
    "soundcard>=0.4",
    "soundfile>=0.12",
]
transcribe = [
    "faster-whisper>=1.0",
]
diarize = [
    "pyannote.audio>=3.1",
    "silero-vad>=5.1",
]
ui = [
    "PyQt6>=6.6",
    "pynput>=1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[project.scripts]
tt = "tt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
